# 通知助手设置示例
# 程序会自动生成 settings.ini，一般不需要手动改；改完保存，重启程序生效。
avatar=
script=D:\通知\通知内容.txt
# 发送间隔（秒，支持两位小数），范围 0.01 ~ 3600
# 间隔 = 两条消息开始发送之间的周期；低于 1 秒会自动压缩单条等待
interval=1.25
# 最后一条发完是否循环（1 开 / 0 关），单次最多 200 条
loop=0
# 是否用 Ctrl+Enter 发送（1 是 / 0 否）
ctrlEnter=0
# 三字经模式（1 开 / 0 关）
sanzijing=0
miniX=-1
miniY=-1
